# infra/docker-compose.yml

version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codesentinel
      POSTGRES_PASSWORD: devpassword

    ports:
      - "5434:5432"
    
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: